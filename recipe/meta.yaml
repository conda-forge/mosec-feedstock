{% set name = "mosec" %}
{% set version = "0.9.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 93343630167c0f26ad74483726fc38895880278faffe5c8ea3a42d87376730d6

build:
  number: 0
  skip: true  # [win]
  script:
    - export CARGO_PROFILE_RELEASE_STRIP=symbols  # [unix]
    - export RUSTFLAGS="$CARGO_BUILD_RUSTFLAGS"   # [unix]

    # Force Cargo to use the target GNU binutils/driver for cross builds.
    - export CARGO_BUILD_TARGET="{{ rust_target }}"  # [build_platform != target_platform]
    - export CARGO_TARGET_{{ rust_target.upper().replace('-', '_') }}_LINKER="$CC"  # [build_platform != target_platform]
    - export CARGO_TARGET_{{ rust_target.upper().replace('-', '_') }}_AR="$AR"  # [build_platform != target_platform]

    # Make native build scripts such as zstd-sys pick the target toolchain too.
    - export CC_{{ rust_target.replace('-', '_') }}="$CC"  # [build_platform != target_platform]
    - export AR_{{ rust_target.replace('-', '_') }}="$AR"  # [build_platform != target_platform]

    - {{ PYTHON }} -m pip install . -vv
    - cargo-bundle-licenses --format yaml --output LICENSES.yml

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - maturin >=1,<2                         # [build_platform != target_platform]
    - cargo-bundle-licenses
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }} >=1.85
  host:
    - python
    - pip
    - maturin >=1,<2
  run:
    - python

test:
  imports:
    - mosec
  requires:
    - pip
  commands:
    - pip check
    - python -c "from mosec import Server, Worker"

about:
  home: https://github.com/mosecorg/mosec
  summary: Model Serving made Efficient in the Cloud
  description: |
    A high-performance serving framework for ML models, offers dynamic batching and
    multi-stage pipeline to fully exploit your compute machine.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSES.yml
  doc_url: https://mosecorg.github.io/mosec/
  dev_url: https://github.com/mosecorg/mosec

extra:
  recipe-maintainers:
    - kemingy
